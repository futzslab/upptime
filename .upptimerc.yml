# Change these first
owner: futzslab # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

user-agent: futzslab-upptime

sites:
  - name: Vaultwarden
    url: https://vaultwarden.futzs.com/alive
    # /alive is Vaultwarden's healthcheck: returns 200 + a timestamp.
    # The root path returns the web vault, which is heavier and slower.
 
  - name: Redmine (mpsts)
    url: https://mpsts.futzs.com
 
  - name: QuickReply
    url: https://quickreply.futzs.com
 
  - name: RCM
    url: https://rcm.futzs.com
 
  - name: Umami
    url: https://umami.futzs.com/api/heartbeat
    # Umami's healthcheck endpoint. Avoids logging a pageview on every probe,
    # which hitting the dashboard root would do.
 
  # --- Hosted elsewhere -------------------------------------------------
  # Not on your server, but you still want to know when they break —
  # usually because of your own push or a DNS edit, not the provider.
 
  - name: futzs.com (GitHub Pages)
    url: https://futzs.com

  - name: SK
    url: https://sergekoudoro.com

  - name: shooter diary
    url: https://shooterdiary.sergekoudoro.com/
 
  - name: icalsync (Fly.io)
    url: https://icalsync.futzs.com
    expectedStatusCodes:
      - 200
      - 405   # HEAD is rejected by design; 405 means the app answered

assignees:
  - skoudoro 
  
status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: uptime.futzs.com
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Futzs Upptime
  introTitle: "**FUTZS** service status"
  introMessage: Live availability for services running on futzs.com. Checks run every 5 minutes from GitHub Actions. Data is public in the [status repository](https://github.com/$OWNER/$REPO).
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Keep short blips out of the incident history (default behaviour deletes
# issues resolved within 15 minutes). Set true to retain every incident.
# skipDeleteIssues: false
# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
